<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Number Guessing Game</title>
        <link rel="stylesheet" href="guess_game.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
        <script src="script.js"></script>
        <style>
            
            body {
                margin: 100px;
                min-height: 100vh;
                padding: 20px;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
                text-align: center;
                background-image: url(galaxy_img.jpg);
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
            }
            button {
                font-family: "Silkscreen", sans-serif;
                font-weight: 700;
                text-shadow: 2px 2px black;
                cursor: pointer;
                border-radius: 10px;
                background: rgb(11, 97, 150);
                background: radial-gradient(circle,rgb(11, 97, 150) 0%, rgb(0, 59, 147) 100%);
                color: rgb(252, 172, 52);
                box-shadow:0 8px 16px 0 rgba(0,0,0,0.6);
            }
            
            button:hover {
                background: yellow;
                background: radial-gradient(circle,yellow 0%, rgb(255, 196, 0) 100%);
                color: palevioletred;
            }
            
            h1 {
                font-family: "Silkscreen", sans-serif;
                color: rgb(252, 172, 52);
                text-shadow: 4px 4px black;
                
            }
            p {
                color :  rgb(252, 172, 52);
                font-family: "Smooch Sans", sans-serif;
                text-shadow: 1px 1px black;
                
            }
            .border-box {
                margin: auto;
                border: 1px solid black; 
                border-radius: 8px;
                width: 90%;
                max-width: 700px;
                padding: 30px;
                box-shadow:0 8px 16px 0 rgba(0,0,0,0.6);
                background: #4f2b6e;
                background: radial-gradient(circle,#7a24c5 0%, rgb(22, 2, 43) 100%);
            }
            

            #guess_img {
                margin: 20px auto;
                width: 100%;
                height: auto;
                display: block;
                border: 2px solid black; 
                box-shadow:0 8px 16px 0 rgba(0,0,0,0.6);
                border-radius: 10px;
            }

            @media (max-width: 480) {
                .border-box {
                    padding: 20px;
                    width: 95%;
                }

                h1 {
                    font-size: 24px;
                    margin-bottom: 12px;
                }

                p {
                    font-size: 20px;
                    margin-bottom: 15px;
                }

                #guess_img {
                    max-width: 220px;
                }

                button {
                    font-size: 14px;
                    padding: 12px 18px;
                }
            }

            @media (min-width: 481px) and (max-width: 768px) {
                .border-box {
                    padding: 30px;
                    width: 85%;
                }

                h1 {
                    font-size: 32px;
                    margin-bottom: 15px;
                }

                p {
                    font-size: 26px;
                    margin-bottom: 20px;
                }

                #guess_img {
                    max-width: 280px;
                }

                button {
                    font-size: 18px;
                    padding: 15px 22px;
                }
            }

            @media (min-width: 769px) {
                .border-box {
                    padding: 40px;
                    width: 70%;
                    max-width: 700px;
                }

                h1 {
                    font-size: 42px;
                    margin-bottom: 20px;
                }

                p {
                    font-size: 32px;
                    margin-bottom: 20px;
                }

                #guess_img {
                    max-width: 320px;
                }

                button {
                    font-size: 22px;
                    padding: 18px 28px;
                }
            }
           
        </style>
    </head>
    <body>
      
        <div class="border-box">
        <h1> Number Guessing Game</h1>
        <p> CLICK START TO PLAY! ENTER A NUMBER BETWEEN 1 AND 10.</p>
        <img src="guessthenum.jpg"  id = guess_img alt="Image that reads guess the number." style ="width: 300px; height: 200px;" >
        <button id="start-btn" type ="button" onclick="StartGame()">Start Game</button>   
        </div>
        
    </body>
</html>
